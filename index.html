<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lot Size Calculator + Journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lot Journal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c; --surface:#181c25; --surface-2:#1f2430;
    --line: rgba(237,234,227,0.09); --line-strong: rgba(237,234,227,0.16);
    --ink:#edeae3; --ink-dim:#9198a6; --ink-faint:#5c6270;
    --gold:#d4a24c; --gold-dim:#8a6d38;
    --profit:#4e9f6e; --profit-bg: rgba(78,159,110,0.12);
    --loss:#c75450; --loss-bg: rgba(199,84,80,0.12);
    --radius: 14px; --radius-sm: 9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100vh;
  }
  .num{font-family:'IBM Plex Mono',monospace;}
  #app{ max-width:480px; margin:0 auto; padding:20px 16px 64px; }
  a{color:var(--gold);}

  .wordmark{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .wordmark h1{ font-size:15px; letter-spacing:0.01em; margin:0; font-weight:600; color:var(--ink); }
  .wordmark h1 span{color:var(--ink-dim); font-weight:500;}
  .gear{ background:none;border:none;color:var(--ink-dim); font-size:18px;cursor:pointer;padding:6px;line-height:1; border-radius:8px; }
  .gear:active{background:var(--surface-2);}

  .hero{
    background:linear-gradient(180deg, var(--surface), var(--surface) 70%, var(--surface-2));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 20px 18px; margin-bottom:16px; animation: rise 0.5s ease-out;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .hero-label{font-size:12px; color:var(--ink-dim); margin-bottom:4px;}
  .hero-capital{ font-size:38px; font-weight:600; letter-spacing:-0.01em; display:flex; align-items:baseline; gap:8px; }
  .hero-capital .delta{font-size:14px; font-weight:500;}
  .hero-row{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .hero-stat{font-size:12px; color:var(--ink-dim);}
  .hero-stat b{color:var(--ink); font-weight:600; font-family:'IBM Plex Mono',monospace;}
  .journey{font-size:11.5px; color:var(--gold-dim); margin-top:8px;}
  .journey b{color:var(--gold); font-weight:600;}

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .card h2{ font-size:14px; margin:0 0 4px; font-weight:600; color:var(--ink); display:flex; align-items:center; justify-content:space-between; }
  .card h2 .tag{ font-size:10.5px; font-weight:600; color:var(--gold); background:rgba(212,162,76,0.12); padding:3px 8px; border-radius:20px; }
  .sub-meta{ font-size:11.5px; color:var(--ink-faint); margin-bottom:14px; }

  label{display:block; font-size:12px; color:var(--ink-dim); margin-bottom:6px;}
  input, select, textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:15px; padding:11px 12px; border-radius:var(--radius-sm); outline:none;
  }
  select, textarea{font-family:'IBM Plex Sans',sans-serif; font-size:14px;}
  textarea{resize:vertical; min-height:76px; line-height:1.5;}
  input[type="checkbox"]{ width:auto; padding:0; accent-color:var(--gold); flex-shrink:0; }
  input:disabled{opacity:0.5;}
  input:focus, select:focus, textarea:focus, button:focus-visible{
    border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,162,76,0.18);
  }
  .field{margin-bottom:14px;}
  .field .hint2{font-size:10.5px; color:var(--ink-faint); margin-top:6px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .period-stats{ display:flex; justify-content:space-between; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:12px; font-size:11.5px; color:var(--ink-dim); }
  .period-stats b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}

  .seg{ display:grid; grid-auto-flow:column; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:3px; margin-bottom:14px; }
  .seg button{ background:none; border:none; color:var(--ink-dim); font-size:13px; font-weight:600; padding:9px 4px; border-radius:7px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; }
  .seg button.active{background:var(--gold); color:#1a1305;}
  .seg.small{margin-bottom:10px;}

  .calc-box{ background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .calc-box .cb-label{font-size:11.5px; color:var(--ink-dim);}
  .calc-box .cb-val{font-size:19px; font-weight:600; font-family:'IBM Plex Mono',monospace; color:var(--gold);}

  details{margin-bottom:14px;}
  summary{ font-size:12.5px; color:var(--ink-dim); cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; padding:4px 0; font-weight:600; }
  summary::-webkit-details-marker{display:none;}
  summary:before{content:'›'; display:inline-block; transition:transform .18s; font-size:15px;}
  details[open] summary:before{transform:rotate(90deg);}
  details .inner{padding-top:12px;}

  button.primary{ width:100%; background:var(--gold); color:#1a1305; border:none; font-size:14.5px; font-weight:600; padding:13px; border-radius:var(--radius-sm); cursor:pointer; font-family:'IBM Plex Sans',sans-serif; }
  button.primary:active{filter:brightness(0.94);}
  button.ghost{ width:100%; background:none; color:var(--ink-dim); border:1px solid var(--line-strong); font-size:13.5px; font-weight:500; padding:11px; border-radius:var(--radius-sm); cursor:pointer; font-family:'IBM Plex Sans',sans-serif; margin-top:8px; }
  button.soft{ width:100%; background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:8px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; }

  .journal-input-row{ display:flex; gap:8px; align-items:flex-start; }
  .journal-input-row textarea{ flex:1; }
  .mic-btn{ flex-shrink:0; width:40px; height:40px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink-dim); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .mic-btn.listening{ background:var(--loss); color:#fff; border-color:var(--loss); animation:pulseMic 1s infinite; }
  .mic-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  @keyframes pulseMic{ 0%,100%{opacity:1;} 50%{opacity:0.55;} }

  .open-summary{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:16px; }
  .open-summary div{font-size:12px; color:var(--ink-dim);}
  .open-summary div b{display:block; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:14.5px; font-weight:600; margin-top:2px;}
  .side-pill{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; }
  .side-buy{background:var(--profit-bg); color:var(--profit);}
  .side-sell{background:var(--loss-bg); color:var(--loss);}

  .img-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .img-thumb{ position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; border:1px solid var(--line-strong); }
  .img-thumb img{ width:100%; height:100%; object-fit:cover; cursor:pointer; }
  .img-thumb button{ position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:rgba(8,9,12,0.75); color:var(--ink); border:none; font-size:12px; cursor:pointer; line-height:1; }

  .ledger-head{ display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 10px; }
  .ledger-head h2{font-size:13px; font-weight:600; color:var(--ink-dim); margin:0;}
  .ledger-head span{font-size:11.5px; color:var(--ink-faint);}
  .empty{ text-align:center; padding:30px 10px; color:var(--ink-faint); font-size:13px; border:1px dashed var(--line); border-radius:var(--radius); }
  .trow{border-bottom:1px solid var(--line); padding:12px 2px;}
  .trow-top{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .trow-date{font-size:11px; color:var(--ink-faint); width:44px; flex-shrink:0; font-family:'IBM Plex Mono',monospace;}
  .trow-mid{flex:1; min-width:0;}
  .trow-instr{font-size:13.5px; font-weight:600;}
  .trow-sub{font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .trow-pl{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; text-align:right; white-space:nowrap;}
  .trow-pl.pos{color:var(--profit);}
  .trow-pl.neg{color:var(--loss);}
  .trow-detail{ margin-top:10px; padding:12px; background:var(--surface-2); border-radius:var(--radius-sm); display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; font-size:12px; color:var(--ink-dim); }
  .trow-detail div b{display:block; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .trow-detail .full{grid-column:1/-1;}
  .trow-detail .full p{margin:0; font-family:'IBM Plex Sans',sans-serif; color:var(--ink); font-size:13px; line-height:1.5;}
  .trow-del{ margin-top:10px; background:none; border:1px solid var(--loss); color:var(--loss); font-size:11.5px; padding:7px 10px; border-radius:8px; cursor:pointer; }

  .veil{ position:fixed; inset:0; background:rgba(8,9,12,0.72); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .veil.center{align-items:center; padding:20px;}
  .sheet{ background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line-strong); animation: up .22s ease-out; }
  @keyframes up{ from{transform:translateY(16px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet h3{margin:0 0 14px; font-size:15px; font-weight:600;}
  .sheet h4{margin:0 0 8px; font-size:12.5px; font-weight:600; color:var(--ink-dim);}
  .sheet .close-x{ float:right; background:none; border:none; color:var(--ink-dim); font-size:20px; cursor:pointer; line-height:1; }
  .lightbox-img{max-width:100%; max-height:80vh; border-radius:10px; display:block; margin:0 auto;}
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink); padding:10px 16px; border-radius:20px; font-size:12.5px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,0.35); }
  .settings-list button{margin-bottom:10px;}
  .hint{font-size:11px; color:var(--ink-faint); margin-top:10px; margin-bottom:0; line-height:1.5;}
  .manage-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; gap:8px; }
  .manage-row label{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; margin:0; font-size:13px; color:var(--ink); cursor:pointer; }
  .manage-row .mini{font-size:10.5px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}
  .manage-row .delbtn{ background:none; border:1px solid var(--line-strong); color:var(--loss); width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:12px; line-height:1; flex-shrink:0; }
  .manage-block{margin-bottom:18px;}
  .bebox{ background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:var(--ink-dim); text-align:center; }
  .bebox b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var STORE_KEY = 'lot_journal_v2';
  var MILESTONES = [
    {d:1,label:'new mindset'},{d:21,label:'new habit'},{d:90,label:'new skill'},
    {d:180,label:'new body'},{d:365,label:'new life'},{d:1095,label:'new you'}
  ];
  var DEFAULT_INSTRUMENTS = [
    {name:'XAUUSD',factor:1}, {name:'GBPUSD',factor:0.001}, {name:'BTC',factor:100},
    {name:'USDJPY',factor:0.15}, {name:'GBPJPY',factor:0.156}, {name:'EURUSD',factor:0.001},
    {name:'USDCAD',factor:0.001}, {name:'AUDUSD',factor:0.001}, {name:'XAGUSD',factor:0.02}
  ];
  var DEFAULT_PATTERNS = ['ROS','Pennant','Wedge','Head & Shoulder','Liq. Swap'];
  var TIMEFRAMES = ['1m','5m','15m','30m','1h','2h','4h','1D','1W'];
  var TF_LINK = {'1m':'1m','5m':'1m','15m':'5m','30m':'5m','1h':'15m','2h':'30m','4h':'1h','1D':'4h','1W':'1D'};
  var RESULTS = ['Target Hit','SL Hit','Trailing SL Hit','Trade Cut','Breakeven'];
  var VOICE_LANGS = [
    {v:'en-IN', l:'Hinglish / English (Roman script)'},
    {v:'hi-IN', l:'Hindi (Devanagari script)'},
    {v:'en-US', l:'English (US)'}
  ];

  var state = load();
  var ui = freshUi();
  var ledgerFilter = { type:'all', value:null };

  function enabledInstruments(){
    var e = state.instruments.filter(function(i){ return i.enabled; });
    return e.length ? e : state.instruments;
  }
  function enabledPatterns(){
    var e = state.patterns.filter(function(p){ return p.enabled; });
    return e.length ? e : state.patterns;
  }

  function freshUi(){
    var eI = enabledInstruments(), eP = enabledPatterns();
    var i0 = eI[0] ? eI[0].name : 'XAUUSD';
    var p0 = eP[0] ? eP[0].name : 'ROS';
    return { mode:'qty', side:'Buy', instrument:i0,
      riskPct:'2', qty:'0.01', slValue:'', entryPrice:'',
      analysisTf:'30m', tradeTf:'5m', time:'', timeManuallySet:false, pattern:p0,
      journalText:'', journalImages:[], journalOpen:false,
      result:'Target Hit', cutSign:'profit', plRaw:'', withdrawalRaw:'',
      exitJournalText:'', exitJournalImages:[],
      showSettings:false, lightboxSrc:null };
  }

  function load(){
    var s;
    try{ var raw = localStorage.getItem(STORE_KEY); if(raw) s = JSON.parse(raw); }catch(e){}
    if(!s) s = { startingCapital:null, firstDate:null, currency:'$', trades:[], openTrade:null };
    if(!s.instruments || !s.instruments.length){
      s.instruments = DEFAULT_INSTRUMENTS.map(function(d){ return {name:d.name, factor:d.factor, enabled:true}; });
    } else {
      s.instruments = s.instruments.map(function(i){
        if(typeof i==='string') return {name:i, factor:1, enabled:true};
        return {name:i.name, factor:(typeof i.factor==='number' ? i.factor : 1), enabled: (typeof i.enabled==='boolean') ? i.enabled : true};
      });
    }
    if(!s.patterns || !s.patterns.length){
      s.patterns = DEFAULT_PATTERNS.map(function(n){ return {name:n, enabled:true}; });
    } else {
      s.patterns = s.patterns.map(function(p){
        if(typeof p==='string') return {name:p, enabled:true};
        return {name:p.name, enabled: (typeof p.enabled==='boolean') ? p.enabled : true};
      });
    }
    if(!s.voiceLang) s.voiceLang = 'en-IN';
    if(!s.trades) s.trades = [];
    s.trades.forEach(function(t){ if(!t.id) t.id = 't_'+Math.random().toString(36).slice(2)+Date.now(); });
    return s;
  }
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast('Storage full — try removing some old photos'); } }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function nowHM(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function fmtDate(iso){ var d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
  function fmtDateLong(iso){ var d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}); }
  function distinctMonths(){
    var s={}; state.trades.forEach(function(t){ s[t.date.slice(0,7)]=true; });
    return Object.keys(s).sort().reverse();
  }
  function distinctYears(){
    var s={}; state.trades.forEach(function(t){ s[t.date.slice(0,4)]=true; });
    return Object.keys(s).sort().reverse();
  }
  function monthLabel(ym){
    var p = ym.split('-'); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  }
  function isoWeekString(d){
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate()+4-dayNum);
    var yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    var weekNo = Math.ceil((((date-yearStart)/86400000)+1)/7);
    return date.getUTCFullYear()+'-W'+String(weekNo).padStart(2,'0');
  }
  function isoWeekToRange(weekStr){
    var parts = weekStr.split('-W');
    var year = parseInt(parts[0],10), week = parseInt(parts[1],10);
    var simple = new Date(year,0,1+(week-1)*7);
    var dow = simple.getDay();
    var start = new Date(simple);
    if(dow<=4) start.setDate(simple.getDate()-dow+1); else start.setDate(simple.getDate()+8-dow);
    var end = new Date(start); end.setDate(start.getDate()+6);
    return [start, end];
  }
  function getFilteredTrades(){
    if(ledgerFilter.type==='all' || !ledgerFilter.value) return state.trades;
    if(ledgerFilter.type==='month'){
      return state.trades.filter(function(t){ return t.date.slice(0,7)===ledgerFilter.value; });
    }
    if(ledgerFilter.type==='year'){
      return state.trades.filter(function(t){ return t.date.slice(0,4)===ledgerFilter.value; });
    }
    if(ledgerFilter.type==='week'){
      var range = isoWeekToRange(ledgerFilter.value);
      var start = range[0], end = range[1];
      return state.trades.filter(function(t){
        var d = new Date(t.date+'T00:00:00');
        return d>=start && d<=end;
      });
    }
    return state.trades;
  }
  function periodLabel(){
    if(ledgerFilter.type==='all' || !ledgerFilter.value) return 'All time';
    if(ledgerFilter.type==='month') return monthLabel(ledgerFilter.value);
    if(ledgerFilter.type==='year') return ledgerFilter.value;
    if(ledgerFilter.type==='week') return 'Week '+ledgerFilter.value;
    return 'All time';
  }

  function money(n){
    if(n===null||n===undefined||isNaN(n)) return '--';
    var c = state.currency||'$'; var neg = n<0;
    var v = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    return (neg?'-':'')+c+v;
  }
  function currentCapital(){
    if(state.openTrade) return state.openTrade.capitalBefore;
    if(state.trades.length) return state.trades[0].capitalAfter;
    return state.startingCapital||0;
  }
  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200);
  }
  function computeFromRisk(capital, riskPct, sl){
    var riskAmt = capital*(riskPct/100); var qty = 0;
    if(sl>0){ var total = riskAmt/sl; qty = Math.round((total/100)*100)/100; }
    return {riskAmt:riskAmt, qty:qty};
  }
  function computeFromQty(capital, qty, sl){
    var total = qty*100; var riskAmt = total*sl;
    var riskPct = capital>0 ? (riskAmt/capital*100) : 0;
    return {riskAmt:riskAmt, riskPct:riskPct};
  }
  function computeSignedPl(resultVal, rawVal, cutSign){
    if(resultVal==='Breakeven') return 0;
    var v = parseFloat(rawVal); if(isNaN(v)) v=0;
    if(resultVal==='Target Hit' || resultVal==='Trailing SL Hit') return Math.abs(v);
    if(resultVal==='SL Hit') return -Math.abs(v);
    if(resultVal==='Trade Cut') return (cutSign==='loss') ? -Math.abs(v) : Math.abs(v);
    return v;
  }

  function niceNum(n){ var r = Math.round(n*100)/100; return (r % 1 === 0) ? String(r) : r.toFixed(2); }
  function netRR(){
    var sum = 0, counted = 0;
    state.trades.forEach(function(t){ if(t.riskAmt>0){ sum += (t.pl/t.riskAmt); counted++; } });
    if(!counted) return null;
    return sum;
  }
  function tradeMetric(t){
    var rr = (t.pl>0 && t.riskAmt>0) ? (t.pl/t.riskAmt) : 0;
    return '1:'+niceNum(rr)+' RR';
  }

  function journeyLine(){
    if(!state.firstDate) return '';
    var days = Math.floor((new Date(todayISO()) - new Date(state.firstDate))/86400000)+1;
    var next = null;
    for(var i=0;i<MILESTONES.length;i++){ if(days<=MILESTONES[i].d){ next=MILESTONES[i]; break; } }
    if(!next) return 'Day <b>'+days+'</b> — every milestone cleared. Still compounding.';
    var left = next.d - days;
    return 'Day <b>'+days+'</b> — '+(left<=0?'today unlocks':left+' day'+(left===1?'':'s')+' to')+' <b>'+next.label+'</b>';
  }

  function calcBoxHtml(){
    var cap = currentCapital();
    var sl = parseFloat(ui.slValue)||0;
    if(ui.mode==='risk'){
      var risk = parseFloat(ui.riskPct)||0;
      var c = computeFromRisk(cap, risk, sl);
      return '<div><div class="cb-label">Lot size to take</div><div class="cb-val">'+(c.qty||0).toFixed(2)+'</div></div>'+
             '<div><div class="cb-label">Risk amount</div><div class="cb-val" style="color:var(--ink)">'+money(c.riskAmt)+'</div></div>';
    } else {
      var qty = parseFloat(ui.qty)||0;
      var c2 = computeFromQty(cap, qty, sl);
      return '<div><div class="cb-label">Risk %</div><div class="cb-val">'+(c2.riskPct||0).toFixed(2)+'%</div></div>'+
             '<div><div class="cb-label">Risk amount</div><div class="cb-val" style="color:var(--ink)">'+money(c2.riskAmt)+'</div></div>';
    }
  }
  function liveCalc(){ var box = document.getElementById('calcBox'); if(box) box.innerHTML = calcBoxHtml(); }

  function bindEvents(){
    var g = document.getElementById('btnGear');
    if(g) g.onclick = function(){ ui.showSettings = true; render(); };
    var vs = document.getElementById('veilSettings');
    if(vs) vs.onclick = function(e){ if(e.target.id==='veilSettings'){ ui.showSettings=false; render(); } };
    var cs = document.getElementById('btnCloseSettings');
    if(cs) cs.onclick = function(){ ui.showSettings=false; render(); };
    var vl = document.getElementById('veilLightbox');
    if(vl) vl.onclick = function(){ ui.lightboxSrc=null; render(); };

    var journalDetails = document.getElementById('journalDetails');
    if(journalDetails) journalDetails.ontoggle = function(){ ui.journalOpen = journalDetails.open; };

    var be = document.getElementById('btnExport');
    if(be) be.onclick = function(){
      var blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lot-size-journal-backup-'+todayISO()+'.json';
      document.body.appendChild(a); a.click(); a.remove();
    };
    var svl = document.getElementById('setVoiceLang');
    if(svl) svl.onchange = function(){ state.voiceLang = svl.value; save(); toast('Voice language updated'); };
    var bsc = document.getElementById('btnSaveCurrency');
    if(bsc) bsc.onclick = function(){
      var v = document.getElementById('setCurrency').value.trim() || '$';
      state.currency = v; save(); render(); toast('Currency updated');
    };
    var br = document.getElementById('btnReset');
    if(br) br.onclick = function(){
      if(confirm('This deletes every trade and your starting capital, permanently. Continue?')){
        state = { startingCapital:null, firstDate:null, currency: state.currency, trades:[], openTrade:null, instruments: state.instruments, patterns: state.patterns };
        save(); ui.showSettings=false; render(); toast('All data cleared');
      }
    };

    document.querySelectorAll('[data-taginstr]').forEach(function(cb){
      cb.onchange = function(){ var idx=parseInt(cb.getAttribute('data-taginstr'),10); state.instruments[idx].enabled = cb.checked; save(); };
    });
    document.querySelectorAll('[data-tagpat]').forEach(function(cb){
      cb.onchange = function(){ var idx=parseInt(cb.getAttribute('data-tagpat'),10); state.patterns[idx].enabled = cb.checked; save(); };
    });

    var btnAddInstrument = document.getElementById('btnAddInstrument');
    if(btnAddInstrument) btnAddInstrument.onclick = function(){
      var name = (document.getElementById('newInstrName').value||'').trim().toUpperCase();
      var factor = parseFloat(document.getElementById('newInstrFactor').value);
      if(!name){ toast('Enter an instrument name'); return; }
      if(!factor || factor<=0){ toast('Enter a valid factor'); return; }
      if(state.instruments.some(function(i){ return i.name===name; })){ toast('Already exists'); return; }
      state.instruments.push({name:name, factor:factor, enabled:true}); save(); render(); toast('Instrument added');
    };
    document.querySelectorAll('[data-rminstr]').forEach(function(btn){
      btn.onclick = function(){
        if(state.instruments.length<=1){ toast('Keep at least one instrument'); return; }
        var idx = parseInt(btn.getAttribute('data-rminstr'),10);
        state.instruments.splice(idx,1); save(); render();
      };
    });
    var btnAddPattern = document.getElementById('btnAddPattern');
    if(btnAddPattern) btnAddPattern.onclick = function(){
      var name = (document.getElementById('newPatternName').value||'').trim();
      if(!name){ toast('Enter a pattern name'); return; }
      if(state.patterns.some(function(p){ return p.name===name; })){ toast('Already exists'); return; }
      state.patterns.push({name:name, enabled:true}); save(); render(); toast('Pattern added');
    };
    document.querySelectorAll('[data-rmpat]').forEach(function(btn){
      btn.onclick = function(){
        if(state.patterns.length<=1){ toast('Keep at least one pattern'); return; }
        var idx = parseInt(btn.getAttribute('data-rmpat'),10);
        state.patterns.splice(idx,1); save(); render();
      };
    });

    var bsetup = document.getElementById('btnSetup');
    if(bsetup) bsetup.onclick = function(){
      var v = parseFloat(document.getElementById('setupCapital').value);
      if(!v || v<=0){ toast('Enter a valid starting capital'); return; }
      state.startingCapital = v; state.firstDate = todayISO();
      save(); render();
    };

    var fRisk = document.getElementById('fRisk');
    if(fRisk) fRisk.oninput = function(){ ui.riskPct = fRisk.value; liveCalc(); };
    var fQty = document.getElementById('fQty');
    if(fQty) fQty.oninput = function(){ ui.qty = fQty.value; liveCalc(); };
    var fSl = document.getElementById('fSl');
    if(fSl) fSl.oninput = function(){ ui.slValue = fSl.value; liveCalc(); };
    var fEntryPrice = document.getElementById('fEntryPrice');
    if(fEntryPrice) fEntryPrice.oninput = function(){ ui.entryPrice = fEntryPrice.value; };
    var fJournalText = document.getElementById('fJournalText');
    if(fJournalText) fJournalText.oninput = function(){ ui.journalText = fJournalText.value; };
    if(fJournalText) fJournalText.onpaste = function(e){
      var cd = e.clipboardData || window.clipboardData;
      if(!cd || !cd.items) return;
      var imgFiles = [];
      for(var i=0;i<cd.items.length;i++){
        var it = cd.items[i];
        if(it.kind==='file' && it.type && it.type.indexOf('image/')===0){
          var f = it.getAsFile();
          if(f) imgFiles.push(f);
        }
      }
      if(imgFiles.length){
        e.preventDefault();
        handleImageFiles(imgFiles, function(src){ ui.journalImages.push(src); render(); });
      }
    };

    var fInstr = document.getElementById('fInstr');
    if(fInstr) fInstr.onchange = function(){ ui.instrument = fInstr.value; render(); };
    var fAnalysisTf = document.getElementById('fAnalysisTf');
    if(fAnalysisTf) fAnalysisTf.onchange = function(){
      ui.analysisTf = fAnalysisTf.value;
      if(TF_LINK[ui.analysisTf]) ui.tradeTf = TF_LINK[ui.analysisTf];
      render();
    };
    var fTradeTf = document.getElementById('fTradeTf');
    if(fTradeTf) fTradeTf.onchange = function(){ ui.tradeTf = fTradeTf.value; };
    var fTime = document.getElementById('fTime');
    if(fTime) fTime.onchange = function(){ ui.time = fTime.value; ui.timeManuallySet = true; };
    var fPat = document.getElementById('fPat');
    if(fPat) fPat.onchange = function(){ ui.pattern = fPat.value; };
    var fSide = document.getElementById('fSide');
    if(fSide) fSide.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ ui.side = b.getAttribute('data-side'); render(); }; });
    var fMode = document.getElementById('fMode');
    if(fMode) fMode.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ ui.mode = b.getAttribute('data-mode'); render(); }; });

    var btnAddPhoto = document.getElementById('btnAddPhoto');
    var fImageInput = document.getElementById('fImageInput');
    if(btnAddPhoto && fImageInput){
      btnAddPhoto.onclick = function(){ fImageInput.click(); };
      fImageInput.onchange = function(){ handleImageFiles(fImageInput.files, function(src){ ui.journalImages.push(src); render(); }); };
    }
    document.querySelectorAll('[data-rmimg]').forEach(function(btn){
      btn.onclick = function(e){ e.stopPropagation(); var idx = parseInt(btn.getAttribute('data-rmimg'),10); ui.journalImages.splice(idx,1); render(); };
    });
    document.querySelectorAll('[data-view]').forEach(function(img){
      img.onclick = function(){ ui.lightboxSrc = img.getAttribute('data-view'); render(); };
    });

    var bce = document.getElementById('btnConfirmEntry');
    if(bce) bce.onclick = function(){
      var cap = currentCapital();
      var sl = parseFloat(ui.slValue)||0;
      if(!sl || sl<=0){ toast('Enter a valid SL value'); return; }
      var calc, riskPct, qty;
      if(ui.mode==='risk'){
        riskPct = parseFloat(ui.riskPct)||0;
        if(riskPct<=0){ toast('Enter a valid risk %'); return; }
        calc = computeFromRisk(cap, riskPct, sl); qty = calc.qty;
      } else {
        qty = parseFloat(ui.qty)||0;
        if(qty<=0){ toast('Enter a valid lot size'); return; }
        calc = computeFromQty(cap, qty, sl); riskPct = calc.riskPct;
      }
      var finalTime = ui.timeManuallySet ? ui.time : nowHM();
      state.openTrade = {
        date: todayISO(), instrument: ui.instrument, side: ui.side,
        riskPct: riskPct, qty: qty, slValue: sl, riskAmt: calc.riskAmt, capitalBefore: cap,
        entryPrice: ui.entryPrice||'',
        analysisTf: ui.analysisTf, tradeTf: ui.tradeTf, time: finalTime, pattern: ui.pattern,
        journalText: ui.journalText||'', journalImages: (ui.journalImages||[]).slice()
      };
      save(); render(); toast('Entry locked in. Trade it, then come back to close.');
    };

    var cJournalText = document.getElementById('cJournalText');
    if(cJournalText) cJournalText.oninput = function(){ ui.exitJournalText = cJournalText.value; };
    if(cJournalText) cJournalText.onpaste = function(e){
      var cd = e.clipboardData || window.clipboardData;
      if(!cd || !cd.items) return;
      var imgFiles = [];
      for(var i=0;i<cd.items.length;i++){
        var it = cd.items[i];
        if(it.kind==='file' && it.type && it.type.indexOf('image/')===0){
          var f = it.getAsFile();
          if(f) imgFiles.push(f);
        }
      }
      if(imgFiles.length){
        e.preventDefault();
        handleImageFiles(imgFiles, function(src){ ui.exitJournalImages.push(src); render(); });
      }
    };
    var btnAddClosePhoto = document.getElementById('btnAddClosePhoto');
    var cImageInput = document.getElementById('cImageInput');
    if(btnAddClosePhoto && cImageInput){
      btnAddClosePhoto.onclick = function(){ cImageInput.click(); };
      cImageInput.onchange = function(){ handleImageFiles(cImageInput.files, function(src){ ui.exitJournalImages.push(src); render(); }); };
    }
    document.querySelectorAll('[data-rmimgexit]').forEach(function(btn){
      btn.onclick = function(e){ e.stopPropagation(); var idx = parseInt(btn.getAttribute('data-rmimgexit'),10); ui.exitJournalImages.splice(idx,1); render(); };
    });

    setupVoiceButton('btnMicEntry', function(text){
      var cur = ui.journalText||'';
      ui.journalText = (cur ? cur+' ' : '') + text;
      var el = document.getElementById('fJournalText');
      if(el) el.value = ui.journalText;
    });
    setupVoiceButton('btnMicExit', function(text){
      var cur = ui.exitJournalText||'';
      ui.exitJournalText = (cur ? cur+' ' : '') + text;
      var el = document.getElementById('cJournalText');
      if(el) el.value = ui.exitJournalText;
    });

    var cResult = document.getElementById('cResult');
    if(cResult) cResult.onchange = function(){ ui.result = cResult.value; render(); };
    var fCutSign = document.getElementById('fCutSign');
    if(fCutSign) fCutSign.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){ ui.cutSign = b.getAttribute('data-cut'); render(); };
    });
    var cPl = document.getElementById('cPl'), cWd = document.getElementById('cWd');
    function updateNewCapPreviewOpen(){
      var signed = computeSignedPl(ui.result, ui.plRaw, ui.cutSign);
      var wd = parseFloat(ui.withdrawalRaw)||0;
      var nc = state.openTrade.capitalBefore + signed - wd;
      var elc = document.getElementById('cNewCap');
      if(elc) elc.textContent = money(nc);
    }
    if(cPl) cPl.oninput = function(){ ui.plRaw = cPl.value; updateNewCapPreviewOpen(); };
    if(cWd) cWd.oninput = function(){ ui.withdrawalRaw = cWd.value; updateNewCapPreviewOpen(); };

    var bClose = document.getElementById('btnCloseTrade');
    if(bClose) bClose.onclick = function(){
      if(ui.result!=='Breakeven' && (ui.plRaw===undefined || ui.plRaw==='' || isNaN(parseFloat(ui.plRaw)))){
        toast('Enter the profit or loss amount'); return;
      }
      var signed = computeSignedPl(ui.result, ui.plRaw, ui.cutSign);
      var wd = parseFloat(ui.withdrawalRaw)||0;
      var t = state.openTrade;
      t.id = 't_'+Math.random().toString(36).slice(2)+Date.now();
      t.result = ui.result; t.pl = signed; t.withdrawal = wd;
      t.exitJournalText = ui.exitJournalText||''; t.exitJournalImages = (ui.exitJournalImages||[]).slice();
      t.capitalAfter = t.capitalBefore + signed - wd; t._open = false;
      state.trades.unshift(t); state.openTrade = null;
      ui = freshUi();
      save(); render(); toast('Trade closed. New capital '+money(t.capitalAfter));
    };
    var bCancel = document.getElementById('btnCancelOpen');
    if(bCancel) bCancel.onclick = function(){
      if(confirm('Discard this open entry without logging it?')){ state.openTrade = null; save(); render(); }
    };

    document.querySelectorAll('[data-ftype]').forEach(function(b){
      b.onclick = function(){
        var t = b.getAttribute('data-ftype');
        ledgerFilter.type = t;
        if(t==='week') ledgerFilter.value = isoWeekString(new Date());
        else if(t==='month') ledgerFilter.value = distinctMonths()[0] || null;
        else if(t==='year') ledgerFilter.value = distinctYears()[0] || null;
        else ledgerFilter.value = null;
        render();
      };
    });
    var lwp = document.getElementById('ledgerWeekPick');
    if(lwp) lwp.onchange = function(){ ledgerFilter.value = lwp.value; render(); };
    var lmp = document.getElementById('ledgerMonthPick');
    if(lmp) lmp.onchange = function(){ ledgerFilter.value = lmp.value; render(); };
    var lyp = document.getElementById('ledgerYearPick');
    if(lyp) lyp.onchange = function(){ ledgerFilter.value = lyp.value; render(); };

    var beCsv = document.getElementById('btnExportCsv');
    if(beCsv) beCsv.onclick = function(){ exportCsv(getFilteredTrades(), periodLabel()); };
    var bePdf = document.getElementById('btnExportPdf');
    if(bePdf) bePdf.onclick = function(){ exportPdf(getFilteredTrades(), periodLabel()); };
    var beDoc = document.getElementById('btnExportDoc');
    if(beDoc) beDoc.onclick = function(){ exportDoc(getFilteredTrades(), periodLabel()); };

    document.querySelectorAll('[data-toggle]').forEach(function(rowEl){
      rowEl.onclick = function(){
        var id = rowEl.getAttribute('data-toggle');
        var t = state.trades.find(function(x){ return x.id===id; });
        if(t){ t._open = !t._open; render(); }
      };
    });
    document.querySelectorAll('[data-del]').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-del');
        if(confirm('Delete this trade permanently? This does not recalculate later capital.')){
          var idx = state.trades.findIndex(function(x){ return x.id===id; });
          if(idx!==-1){ state.trades.splice(idx,1); save(); render(); }
        }
      };
    });
  }

  function csvEscape(v){
    var s = (v===undefined||v===null)?'':String(v);
    if(/[",\n]/.test(s)){ s = '"'+s.replace(/"/g,'""')+'"'; }
    return s;
  }
  function exportCsv(trades, label){
    if(!trades.length){ toast('Nothing to export in this period'); return; }
    var headers = ['Date','Time','Instrument','Side','Result','Entry Price','Exit Price','Risk %','Lot Size','SL Value','Risk Amount','P/L','Withdrawal','Capital Before','Capital After','Analysis TF','Trade TF','Pattern','Photos','Notes'];
    var sorted = trades.slice().sort(function(a,b){ return a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''); });
    var rows = [headers.map(csvEscape).join(',')];
    sorted.forEach(function(t){
      rows.push([
        t.date, t.time||'', t.instrument, t.side, t.result,
        t.entryPrice||'', t.exitPrice||'',
        t.riskPct.toFixed(2), t.qty.toFixed(2), t.slValue, t.riskAmt.toFixed(2),
        t.pl.toFixed(2), (t.withdrawal||0).toFixed(2),
        t.capitalBefore.toFixed(2), t.capitalAfter.toFixed(2),
        t.analysisTf||'', t.tradeTf||'', t.pattern||'',
        (t.journalImages?t.journalImages.length:0), t.journalText||''
      ].map(csvEscape).join(','));
    });
    var blob = new Blob([rows.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lot-journal-'+label.replace(/\s+/g,'-').toLowerCase()+'-'+todayISO()+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function summarize(trades){
    var netPl = trades.reduce(function(s,t){ return s+t.pl; },0);
    var wins = trades.filter(function(t){ return t.pl>0; }).length;
    var winRate = trades.length ? Math.round(wins/trades.length*100) : 0;
    return {count:trades.length, netPl:netPl, winRate:winRate};
  }
  function buildReportHtml(trades, label){
    var sum = summarize(trades);
    var sorted = trades.slice().sort(function(a,b){ return a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''); });
    var rowsHtml = sorted.map(function(t){
      var plColor = t.pl>0?'#1e7d43':(t.pl<0?'#b3261e':'#333');
      return '<tr><td>'+t.date+'</td><td>'+(t.time||'')+'</td><td>'+t.instrument+'</td><td>'+t.side+'</td>'+
        '<td>'+t.result+'</td><td>'+tradeMetric(t)+'</td>'+
        '<td>'+t.riskPct.toFixed(2)+'%</td><td>'+t.qty.toFixed(2)+'</td><td>'+t.slValue+'</td>'+
        '<td style="color:'+plColor+'">'+(t.pl>0?'+':'')+money(t.pl)+'</td>'+
        '<td>'+money(t.capitalAfter)+'</td></tr>';
    }).join('');
    var notesHtml = sorted.filter(function(t){ return t.journalText || (t.journalImages && t.journalImages.length); }).map(function(t){
      var imgs = (t.journalImages||[]).map(function(src){ return '<img src="'+src+'" style="max-width:220px;max-height:220px;border-radius:6px;margin:4px 8px 4px 0;border:1px solid #ddd;">'; }).join('');
      return '<div style="margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #e5e5e5;">'+
        '<div style="font-weight:600;margin-bottom:4px;">'+fmtDate(t.date)+' · '+t.instrument+' '+t.side+' · '+t.result+'</div>'+
        (t.journalText? '<div style="white-space:pre-wrap;line-height:1.5;color:#333;margin-bottom:6px;">'+escapeHtml(t.journalText)+'</div>' : '')+
        (imgs? '<div>'+imgs+'</div>' : '')+
      '</div>';
    }).join('');
    return '<html><head><meta charset="utf-8"><title>Lot Journal Report — '+label+'</title><style>'+
      'body{font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;padding:24px;max-width:900px;margin:0 auto;}'+
      'h1{font-size:20px;margin-bottom:2px;} .sub{color:#666;font-size:12px;margin-bottom:18px;}'+
      '.stats{display:flex;gap:24px;margin-bottom:20px;padding:12px 16px;background:#f5f5f5;border-radius:8px;font-size:13px;}'+
      '.stats b{display:block;font-size:16px;}'+
      'table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:26px;}'+
      'th,td{border:1px solid #ddd;padding:6px 8px;text-align:left;} th{background:#f0f0f0;}'+
      'h2{font-size:15px;border-top:2px solid #222;padding-top:14px;margin-top:0;}'+
      '@media print{ body{padding:0;} }'+
      '</style></head><body>'+
      '<h1>Lot Size Calculator + Journal — Trade Report</h1>'+
      '<div class="sub">Period: '+label+' &nbsp;·&nbsp; Generated '+fmtDate(todayISO())+'</div>'+
      '<div class="stats"><div>Trades<b>'+sum.count+'</b></div>'+
      '<div>Net P/L<b style="color:'+(sum.netPl>=0?'#1e7d43':'#b3261e')+'">'+(sum.netPl>=0?'+':'')+money(sum.netPl)+'</b></div>'+
      '<div>Win rate<b>'+sum.winRate+'%</b></div></div>'+
      '<table><thead><tr><th>Date</th><th>Time</th><th>Instrument</th><th>Side</th><th>Result</th><th>RR</th><th>Risk %</th><th>Lot</th><th>SL</th><th>P/L</th><th>Capital After</th></tr></thead>'+
      '<tbody>'+rowsHtml+'</tbody></table>'+
      (notesHtml ? '<h2>Trade Notes &amp; Charts</h2>'+notesHtml : '')+
      '</body></html>';
  }
  function exportPdf(trades, label){
    if(!trades.length){ toast('Nothing to export in this period'); return; }
    var w = window.open('', '_blank');
    if(!w){ toast('Please allow pop-ups to export PDF'); return; }
    w.document.open(); w.document.write(buildReportHtml(trades,label)); w.document.close();
    setTimeout(function(){ w.focus(); w.print(); }, 400);
  }
  function exportDoc(trades, label){
    if(!trades.length){ toast('Nothing to export in this period'); return; }
    var blob = new Blob(['\ufeff'+buildReportHtml(trades,label)], {type:'application/msword'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lot-journal-'+label.replace(/\s+/g,'-').toLowerCase()+'-'+todayISO()+'.doc';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function setupVoiceButton(btnId, applyTranscript){
    var btn = document.getElementById(btnId);
    if(!btn) return;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ btn.disabled = true; btn.title = 'Voice input needs Chrome (Android/desktop)'; return; }
    btn.onclick = function(){
      if(btn._rec){ btn._rec.stop(); return; }
      var rec = new SR();
      rec.lang = state.voiceLang || 'en-IN';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onstart = function(){ btn.classList.add('listening'); btn.textContent = '●'; };
      rec.onresult = function(e){
        var t = e.results[0][0].transcript;
        if(t) applyTranscript(t);
      };
      rec.onerror = function(){ toast('Voice input error — try again'); };
      rec.onend = function(){ btn.classList.remove('listening'); btn.textContent = '🎤'; btn._rec = null; };
      btn._rec = rec;
      try{ rec.start(); }catch(e){ btn._rec = null; }
    };
  }

  function handleImageFiles(fileList, onEach){
    Array.prototype.slice.call(fileList).forEach(function(file){
      if(!file.type || file.type.indexOf('image/')!==0) return;
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var maxW = 900;
          var scale = Math.min(1, maxW/img.width);
          var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
          var canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          onEach(canvas.toDataURL('image/jpeg',0.72));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
})();
</script>
